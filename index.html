<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventaris Baleadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Animasi loading sederhana */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight"><i class="fa-solid fa-boxes-stacked mr-2"></i> Inventaris Baleadi</h1>
            <button onclick="openFormModal()" class="bg-white text-blue-600 hover:bg-gray-100 font-semibold py-2 px-4 rounded-lg shadow transition duration-150 ease-in-out">
                <i class="fa-solid fa-plus mr-1"></i> Tambah Data
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 w-full">
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 font-medium">Memuat data dari server...</p>
        </div>

        <!-- Grid Container untuk Data Inventaris -->
        <div id="inventoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Card Data akan di-render di sini oleh JavaScript -->
        </div>
        
        <!-- Pesan Kosong -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="fa-solid fa-folder-open text-6xl mb-4"></i>
            <p class="text-xl font-medium">Belum ada data inventaris.</p>
        </div>
    </main>

    <!-- Modal Form (Tambah/Edit) -->
    <div id="formModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center overflow-y-auto px-4 py-6">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-auto relative flex flex-col max-h-full">
            <div class="flex justify-between items-center p-6 border-b">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-900">Tambah Data Inventaris</h3>
                <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow">
                <form id="inventoryForm" class="space-y-4">
                    <input type="hidden" id="itemId">
                    <!-- Base64 Penampung Gambar Lama jika Edit -->
                    <input type="hidden" id="existingImageBase64">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Lokasi</label>
                        <textarea id="alamatLokasi" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Asal Usul</label>
                        <input type="text" id="asalUsul" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Batas Utara</label>
                            <input type="text" id="batasUtara" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Batas Selatan</label>
                            <input type="text" id="batasSelatan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Batas Timur</label>
                            <input type="text" id="batasTimur" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Batas Barat</label>
                            <input type="text" id="batasBarat" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bukti Batas (Gambar/Foto)</label>
                        <input type="file" id="buktiBatas" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                        <div id="imagePreviewContainer" class="mt-3 hidden">
                            <img id="imagePreview" src="" alt="Preview" class="h-32 object-contain rounded-lg border">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-6 border-t bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button onclick="closeFormModal()" class="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 font-medium transition">Batal</button>
                <button onclick="saveData()" id="btnSave" class="px-5 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 font-medium transition flex items-center">
                    <span id="btnSaveText">Simpan</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal Pesan (Pengganti Alert) -->
    <div id="messageModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center transform transition-all">
            <div id="messageIcon" class="mb-4 text-4xl text-blue-500"><i class="fa-solid fa-circle-info"></i></div>
            <h3 id="messageTitle" class="text-lg font-bold text-gray-900 mb-2">Pesan</h3>
            <p id="messageContent" class="text-gray-600 mb-6"></p>
            <button onclick="closeMessageModal()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">Tutup</button>
        </div>
    </div>

    <!-- Custom Modal Konfirmasi (Pengganti Confirm) -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
            <div class="mb-4 text-4xl text-red-500"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Hapus Data?</h3>
            <p class="text-gray-600 mb-6">Apakah Anda yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirmModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium transition">Batal</button>
                <button id="btnConfirmDelete" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * PENTING: GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
         */
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXO5upgUG9Z-OwqCzAk-ej7Nh19uPJe3ew0qJvJAJWqZgh8Q7yMbpkbvM7T1GYL2Kl/exec";
        
        // State Management
        let inventoryData = {};
        let deleteTargetId = null;

        // Utilities: Modal Pesan
        function showMessage(title, message, type = 'info') {
            document.getElementById('messageTitle').innerText = title;
            document.getElementById('messageContent').innerText = message;
            
            const icon = document.getElementById('messageIcon');
            if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>';
            else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
            else icon.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500"></i>';

            document.getElementById('messageModal').classList.remove('hidden');
        }

        function closeMessageModal() {
            document.getElementById('messageModal').classList.add('hidden');
        }

        // Utilities: Konversi Gambar ke Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Event Listener untuk Preview Gambar saat memilih file
        document.getElementById('buktiBatas').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('imagePreview').src = event.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('imagePreview').src = '';
            }
        });

        
        // Membaca Data dari GAS Middleware
        async function fetchData() {
            setLoading(true);
            try {
                const response = await fetch(`${GAS_WEB_APP_URL}?action=read`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    inventoryData = result.data || {};
                    renderGrid();
                } else {
                    showMessage("Gagal", "Gagal mengambil data: " + result.message, "error");
                }
            } catch (error) {
                showMessage("Kesalahan Jaringan", "Periksa koneksi Anda dan pastikan URL GAS sudah benar.", "error");
                console.error(error);
            } finally {
                setLoading(false);
            }
        }

        // Menyimpan Data (Insert / Update)
        async function saveData() {
            const btnSave = document.getElementById('btnSave');
            const btnText = document.getElementById('btnSaveText');
            
            // Validasi Sederhana
            const alamat = document.getElementById('alamatLokasi').value.trim();
            const asal = document.getElementById('asalUsul').value.trim();
            if(!alamat || !asal) {
                showMessage("Peringatan", "Kolom Alamat Lokasi dan Asal Usul wajib diisi.", "error");
                return;
            }

            btnSave.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';

            const id = document.getElementById('itemId').value;
            const action = id ? 'update' : 'insert';
            
            const fileInput = document.getElementById('buktiBatas');
            let base64Image = document.getElementById('existingImageBase64').value; // Pakai yang lama defaultnya
            
            // Jika ada file baru yang diupload
            if (fileInput.files.length > 0) {
                try {
                    base64Image = await fileToBase64(fileInput.files[0]);
                } catch (e) {
                    showMessage("Gagal", "Gagal memproses gambar.", "error");
                    btnSave.disabled = false;
                    btnText.innerText = 'Simpan';
                    return;
                }
            }

            const dataToSave = {
                alamatLokasi: alamat,
                asalUsul: asal,
                batasUtara: document.getElementById('batasUtara').value.trim(),
                batasSelatan: document.getElementById('batasSelatan').value.trim(),
                batasTimur: document.getElementById('batasTimur').value.trim(),
                batasBarat: document.getElementById('batasBarat').value.trim(),
                buktiBatas: base64Image
            };

            const payload = {
                action: action,
                id: id,
                data: dataToSave
            };

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    closeFormModal();
                    showMessage("Sukses", result.message, "success");
                    fetchData(); // Refresh Data
                } else {
                    showMessage("Gagal Menyimpan", result.message, "error");
                }
            } catch (error) {
                showMessage("Kesalahan Jaringan", "Terjadi kesalahan saat mengirim data.", "error");
            } finally {
                btnSave.disabled = false;
                btnText.innerText = 'Simpan';
            }
        }

        // Konfirmasi Hapus Data
        function promptDelete(id) {
            deleteTargetId = id;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            deleteTargetId = null;
            document.getElementById('confirmModal').classList.add('hidden');
        }

        // Eksekusi Hapus Data
        document.getElementById('btnConfirmDelete').addEventListener('click', async function() {
            if (!deleteTargetId) return;
            
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...';
            btn.disabled = true;

            const payload = {
                action: 'delete',
                id: deleteTargetId
            };

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showMessage("Terhapus", "Data berhasil dihapus", "success");
                    fetchData(); // Refresh
                } else {
                    showMessage("Gagal", result.message, "error");
                }
            } catch (error) {
                showMessage("Kesalahan Jaringan", "Gagal menghubungi server.", "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                closeConfirmModal();
            }
        });

        
        // Membuka Form untuk Tambah atau Edit
        function openFormModal(id = null) {
            document.getElementById('inventoryForm').reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imagePreview').src = '';
            document.getElementById('existingImageBase64').value = '';
            
            if (id && inventoryData[id]) {
                document.getElementById('modalTitle').innerText = 'Edit Data Inventaris';
                document.getElementById('itemId').value = id;
                
                const item = inventoryData[id];
                document.getElementById('alamatLokasi').value = item.alamatLokasi || '';
                document.getElementById('asalUsul').value = item.asalUsul || '';
                document.getElementById('batasUtara').value = item.batasUtara || '';
                document.getElementById('batasSelatan').value = item.batasSelatan || '';
                document.getElementById('batasTimur').value = item.batasTimur || '';
                document.getElementById('batasBarat').value = item.batasBarat || '';
                
                if (item.buktiBatas) {
                    document.getElementById('existingImageBase64').value = item.buktiBatas;
                    document.getElementById('imagePreview').src = item.buktiBatas;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Tambah Data Inventaris';
                document.getElementById('itemId').value = '';
            }
            
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeFormModal() {
            document.getElementById('formModal').classList.add('hidden');
        }

        // Render Data ke Grid UI
        function renderGrid() {
            const grid = document.getElementById('inventoryGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';
            
            const keys = Object.keys(inventoryData);
            
            if (keys.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            keys.forEach(key => {
                const item = inventoryData[key];
                // Buat struktur card
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow border border-gray-100 overflow-hidden hover:shadow-lg transition duration-200 flex flex-col";
                
                // Cek gambar bukti
                const imgSrc = item.buktiBatas && item.buktiBatas.startsWith('data:image') 
                    ? item.buktiBatas 
                    : 'https://placehold.co/600x400/f3f4f6/a1a1aa?text=Tidak+Ada+Foto';

                card.innerHTML = `
                    <div class="h-48 w-full bg-gray-100 overflow-hidden relative">
                        <img src="${imgSrc}" alt="Bukti Batas" class="w-full h-full object-cover">
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        <h4 class="font-bold text-lg text-gray-900 mb-1 line-clamp-2">${item.alamatLokasi || '-'}</h4>
                        <p class="text-sm text-blue-600 font-medium mb-4"><i class="fa-solid fa-tag mr-1"></i>${item.asalUsul || '-'}</p>
                        
                        <div class="grid grid-cols-2 gap-x-2 gap-y-3 text-sm text-gray-600 mb-5 bg-gray-50 p-3 rounded-lg flex-grow">
                            <div><span class="block text-xs text-gray-400 uppercase font-semibold">Utara</span>${item.batasUtara || '-'}</div>
                            <div><span class="block text-xs text-gray-400 uppercase font-semibold">Selatan</span>${item.batasSelatan || '-'}</div>
                            <div><span class="block text-xs text-gray-400 uppercase font-semibold">Timur</span>${item.batasTimur || '-'}</div>
                            <div><span class="block text-xs text-gray-400 uppercase font-semibold">Barat</span>${item.batasBarat || '-'}</div>
                        </div>
                        
                        <div class="flex justify-end gap-2 border-t pt-4 mt-auto">
                            <button onclick="openFormModal('${key}')" class="text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded transition font-medium text-sm">
                                <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                            </button>
                            <button onclick="promptDelete('${key}')" class="text-red-600 hover:bg-red-50 px-3 py-1.5 rounded transition font-medium text-sm">
                                <i class="fa-solid fa-trash mr-1"></i> Hapus
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setLoading(isLoading) {
            const loader = document.getElementById('loadingIndicator');
            const grid = document.getElementById('inventoryGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (isLoading) {
                loader.classList.remove('hidden');
                grid.classList.add('hidden');
                emptyState.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        // Inisialisasi awal saat load
        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });
    </script>
</body>
</html>
