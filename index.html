<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventaris Baleadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Animasi loading sederhana */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight flex items-center">
                <i class="fa-solid fa-boxes-stacked mr-3"></i> Inventaris Baleadi
            </h1>
            <button onclick="InventoryApp.openFormModal()" class="bg-white text-blue-600 hover:bg-blue-50 font-semibold py-2 px-4 rounded-lg shadow-sm transition duration-150 ease-in-out flex items-center">
                <i class="fa-solid fa-plus sm:mr-2"></i> <span class="hidden sm:inline">Tambah Data</span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 w-full">
        <!-- Fitur Pencarian -->
        <div class="mb-6 max-w-md mx-auto sm:mx-0">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" onkeyup="InventoryApp.filterData()" placeholder="Cari lokasi atau asal usul..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm">
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 font-medium">Memuat data dari server...</p>
        </div>

        <!-- Grid Container untuk Data Inventaris -->
        <div id="inventoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Card Data dirender via JavaScript -->
        </div>
        
        <!-- Pesan Kosong / Tidak ada hasil -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="fa-solid fa-folder-open text-6xl mb-4 text-gray-300"></i>
            <p id="emptyStateText" class="text-xl font-medium">Belum ada data inventaris.</p>
        </div>
    </main>

    <!-- Modal Form (Tambah/Edit) -->
    <div id="formModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center overflow-y-auto px-4 py-6 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-auto relative flex flex-col max-h-full">
            <div class="flex justify-between items-center p-6 border-b border-gray-100">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Tambah Data Inventaris</h3>
                <button onclick="InventoryApp.closeFormModal()" class="text-gray-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow custom-scrollbar">
                <form id="inventoryForm" class="space-y-5">
                    <input type="hidden" id="itemId">
                    <!-- Base64 Penampung Gambar Lama jika Edit -->
                    <input type="hidden" id="existingImageBase64">
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Lokasi <span class="text-red-500">*</span></label>
                        <textarea id="alamatLokasi" rows="2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Asal Usul <span class="text-red-500">*</span></label>
                        <input type="text" id="asalUsul" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Batas Utara</label>
                            <input type="text" id="batasUtara" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Batas Selatan</label>
                            <input type="text" id="batasSelatan" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Batas Timur</label>
                            <input type="text" id="batasTimur" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Batas Barat</label>
                            <input type="text" id="batasBarat" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Bukti Batas (Gambar/Foto)</label>
                        <input type="file" id="buktiBatas" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                        <p class="text-xs text-gray-400 mt-1">Gambar akan dikompresi otomatis agar ukuran file kecil.</p>
                        <div id="imagePreviewContainer" class="mt-3 hidden relative inline-block">
                            <img id="imagePreview" src="" alt="Preview" class="h-32 object-contain rounded-lg border shadow-sm">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-6 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button onclick="InventoryApp.closeFormModal()" class="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 font-medium transition">Batal</button>
                <button onclick="InventoryApp.saveData()" id="btnSave" class="px-5 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 font-medium transition flex items-center shadow-md">
                    <span id="btnSaveText">Simpan Data</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal Pesan (Pengganti Alert) -->
    <div id="messageModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center transform transition-all">
            <div id="messageIcon" class="mb-4 text-5xl"></div>
            <h3 id="messageTitle" class="text-lg font-bold text-gray-900 mb-2">Pesan</h3>
            <p id="messageContent" class="text-gray-600 mb-6"></p>
            <button onclick="InventoryApp.closeMessageModal()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Tutup</button>
        </div>
    </div>

    <!-- Custom Modal Konfirmasi (Pengganti Confirm) -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
            <div class="mb-4 text-5xl text-red-500"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Hapus Data?</h3>
            <p class="text-gray-600 mb-6">Apakah Anda yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="InventoryApp.closeConfirmModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-medium transition border border-gray-200">Batal</button>
                <button id="btnConfirmDelete" onclick="InventoryApp.executeDelete()" class="flex-1 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition shadow-md">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * PENTING: URL WEB APP GOOGLE APPS SCRIPT
         */
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFkkogmQamx05c3xqxwAstebQDLE_U_DWwQDIE_pIUkIz9O3wQpLZX75zIki-rypg2iw/exec";
        
        const InventoryApp = {
            data: {},
            deleteTargetId: null,

            // Inisialisasi Aplikasi
            init() {
                this.bindEvents();
                this.fetchData();
            },

            // Binding Event Listeners
            bindEvents() {
                // Event Preview Gambar
                document.getElementById('buktiBatas').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            document.getElementById('imagePreview').src = event.target.result;
                            document.getElementById('imagePreviewContainer').classList.remove('hidden');
                        }
                        reader.readAsDataURL(file);
                    } else {
                        document.getElementById('imagePreviewContainer').classList.add('hidden');
                        document.getElementById('imagePreview').src = '';
                    }
                });
            },

            // Menampilkan Modal Pesan
            showMessage(title, message, type = 'info') {
                document.getElementById('messageTitle').innerText = title;
                document.getElementById('messageContent').innerText = message;
                
                const icon = document.getElementById('messageIcon');
                if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>';
                else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
                else icon.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500"></i>';

                document.getElementById('messageModal').classList.remove('hidden');
            },

            closeMessageModal() {
                document.getElementById('messageModal').classList.add('hidden');
            },

            // Kompresi Gambar untuk menghemat kapasitas Realtime Database
            compressImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_SIZE = 800; // Maksimal lebar/tinggi 800px
                            let width = img.width;
                            let height = img.height;

                            if (width > height && width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            } else if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // Kompresi ke JPEG dengan kualitas 70%
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                        img.onerror = (e) => reject("Gagal memuat gambar");
                    };
                    reader.onerror = error => reject(error);
                });
            },

            // Mengambil data dari server
            async fetchData() {
                this.setLoading(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=read`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this.data = result.data || {};
                        this.renderGrid();
                    } else {
                        this.showMessage("Gagal", "Gagal mengambil data: " + result.message, "error");
                    }
                } catch (error) {
                    this.showMessage("Kesalahan Jaringan", "Periksa koneksi Anda dan pastikan URL GAS sudah benar.", "error");
                    console.error(error);
                } finally {
                    this.setLoading(false);
                }
            },

            // Menyimpan Data Baru / Edit
            async saveData() {
                const btnSave = document.getElementById('btnSave');
                const btnText = document.getElementById('btnSaveText');
                
                // Validasi Input
                const alamat = document.getElementById('alamatLokasi').value.trim();
                const asal = document.getElementById('asalUsul').value.trim();
                if(!alamat || !asal) {
                    this.showMessage("Peringatan", "Kolom Alamat Lokasi dan Asal Usul wajib diisi.", "error");
                    return;
                }

                btnSave.disabled = true;
                btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';

                const id = document.getElementById('itemId').value;
                const action = id ? 'update' : 'insert';
                const fileInput = document.getElementById('buktiBatas');
                let base64Image = document.getElementById('existingImageBase64').value;
                
                // Proses Gambar (Jika Ada) dengan Kompresi
                if (fileInput.files.length > 0) {
                    try {
                        base64Image = await this.compressImage(fileInput.files[0]);
                    } catch (e) {
                        this.showMessage("Gagal", "Gagal memproses gambar bukti.", "error");
                        this.resetButton(btnSave, btnText);
                        return;
                    }
                }

                const dataToSave = {
                    alamatLokasi: alamat,
                    asalUsul: asal,
                    batasUtara: document.getElementById('batasUtara').value.trim(),
                    batasSelatan: document.getElementById('batasSelatan').value.trim(),
                    batasTimur: document.getElementById('batasTimur').value.trim(),
                    batasBarat: document.getElementById('batasBarat').value.trim(),
                    buktiBatas: base64Image
                };

                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: action, id: id, data: dataToSave })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this.closeFormModal();
                        this.showMessage("Sukses", result.message, "success");
                        this.fetchData(); 
                    } else {
                        this.showMessage("Gagal Menyimpan", result.message, "error");
                    }
                } catch (error) {
                    this.showMessage("Kesalahan Jaringan", "Terjadi kesalahan saat mengirim data.", "error");
                } finally {
                    this.resetButton(btnSave, btnText);
                }
            },

            resetButton(btn, textElement) {
                btn.disabled = false;
                textElement.innerText = 'Simpan Data';
            },

            promptDelete(id) {
                this.deleteTargetId = id;
                document.getElementById('confirmModal').classList.remove('hidden');
            },

            closeConfirmModal() {
                this.deleteTargetId = null;
                document.getElementById('confirmModal').classList.add('hidden');
            },

            async executeDelete() {
                if (!this.deleteTargetId) return;
                
                const btn = document.getElementById('btnConfirmDelete');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...';
                btn.disabled = true;

                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'delete', id: this.deleteTargetId })
                    });
                    
                    const result = await response.json();
                    if (result.status === 'success') {
                        this.showMessage("Terhapus", "Data berhasil dihapus", "success");
                        this.fetchData();
                    } else {
                        this.showMessage("Gagal", result.message, "error");
                    }
                } catch (error) {
                    this.showMessage("Kesalahan Jaringan", "Gagal menghubungi server.", "error");
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    this.closeConfirmModal();
                }
            },

            openFormModal(id = null) {
                document.getElementById('inventoryForm').reset();
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('imagePreview').src = '';
                document.getElementById('existingImageBase64').value = '';
                
                if (id && this.data[id]) {
                    document.getElementById('modalTitle').innerText = 'Edit Data Inventaris';
                    document.getElementById('itemId').value = id;
                    
                    const item = this.data[id];
                    document.getElementById('alamatLokasi').value = item.alamatLokasi || '';
                    document.getElementById('asalUsul').value = item.asalUsul || '';
                    document.getElementById('batasUtara').value = item.batasUtara || '';
                    document.getElementById('batasSelatan').value = item.batasSelatan || '';
                    document.getElementById('batasTimur').value = item.batasTimur || '';
                    document.getElementById('batasBarat').value = item.batasBarat || '';
                    
                    if (item.buktiBatas) {
                        document.getElementById('existingImageBase64').value = item.buktiBatas;
                        document.getElementById('imagePreview').src = item.buktiBatas;
                        document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('modalTitle').innerText = 'Tambah Data Inventaris';
                    document.getElementById('itemId').value = '';
                }
                
                document.getElementById('formModal').classList.remove('hidden');
            },

            closeFormModal() {
                document.getElementById('formModal').classList.add('hidden');
            },

            filterData() {
                const query = document.getElementById('searchInput').value.toLowerCase();
                this.renderGrid(query);
            },

            renderGrid(searchQuery = '') {
                const grid = document.getElementById('inventoryGrid');
                const emptyState = document.getElementById('emptyState');
                const emptyStateText = document.getElementById('emptyStateText');
                grid.innerHTML = '';
                
                const keys = Object.keys(this.data);
                
                // Filter data berdasarkan pencarian
                const filteredKeys = keys.filter(key => {
                    const item = this.data[key];
                    const alamat = (item.alamatLokasi || '').toLowerCase();
                    const asal = (item.asalUsul || '').toLowerCase();
                    return alamat.includes(searchQuery) || asal.includes(searchQuery);
                });

                if (filteredKeys.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    emptyStateText.innerText = searchQuery ? 'Tidak ada data yang cocok dengan pencarian.' : 'Belum ada data inventaris.';
                    return;
                }
                
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');

                filteredKeys.forEach(key => {
                    const item = this.data[key];
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col group";
                    
                    const imgSrc = item.buktiBatas && item.buktiBatas.startsWith('data:image') 
                        ? item.buktiBatas 
                        : 'https://placehold.co/600x400/f8fafc/94a3b8?text=Tidak+Ada+Foto';

                    card.innerHTML = `
                        <div class="h-48 w-full bg-gray-100 overflow-hidden relative border-b border-gray-100">
                            <img src="${imgSrc}" alt="Bukti Batas" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h4 class="font-bold text-lg text-gray-800 mb-1 line-clamp-2" title="${item.alamatLokasi || '-'}">${item.alamatLokasi || '-'}</h4>
                            <p class="text-sm text-blue-600 font-medium mb-4 flex items-center"><i class="fa-solid fa-map-pin mr-2"></i>${item.asalUsul || '-'}</p>
                            
                            <div class="grid grid-cols-2 gap-2 text-sm text-gray-600 mb-5 bg-gray-50 p-3 rounded-lg flex-grow border border-gray-100">
                                <div><span class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider">Utara</span><span class="font-medium text-gray-700">${item.batasUtara || '-'}</span></div>
                                <div><span class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider">Selatan</span><span class="font-medium text-gray-700">${item.batasSelatan || '-'}</span></div>
                                <div><span class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider">Timur</span><span class="font-medium text-gray-700">${item.batasTimur || '-'}</span></div>
                                <div><span class="block text-[10px] text-gray-400 uppercase font-bold tracking-wider">Barat</span><span class="font-medium text-gray-700">${item.batasBarat || '-'}</span></div>
                            </div>
                            
                            <div class="flex justify-end gap-2 pt-2 mt-auto">
                                <button onclick="InventoryApp.openFormModal('${key}')" class="text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-lg transition font-medium text-sm flex-1 flex items-center justify-center">
                                    <i class="fa-solid fa-pen-to-square mr-2"></i> Edit
                                </button>
                                <button onclick="InventoryApp.promptDelete('${key}')" class="text-red-600 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition font-medium text-sm flex-1 flex items-center justify-center">
                                    <i class="fa-solid fa-trash-can mr-2"></i> Hapus
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            },

            setLoading(isLoading) {
                const loader = document.getElementById('loadingIndicator');
                const grid = document.getElementById('inventoryGrid');
                const emptyState = document.getElementById('emptyState');
                
                if (isLoading) {
                    loader.classList.remove('hidden');
                    grid.classList.add('hidden');
                    emptyState.classList.add('hidden');
                } else {
                    loader.classList.add('hidden');
                }
            }
        };

        // Inisialisasi saat DOM selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            InventoryApp.init();
        });
    </script>
</body>
</html>
